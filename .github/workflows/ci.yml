name: CI - Monitoraggio reputazione online

# Si attiva solo quando un push o una pull request su main tocca qualcosa
# dentro sentiment_reputation_mlops/, non ad ogni modifica di un progetto
# qualsiasi del monorepo.
on:
  push:
    branches: [ main ]
    paths:
      - "Monitoraggio della reputazione online di un’azienda/sentiment_reputation_mlops/**"
  pull_request:
    branches: [ main ]
    paths:
      - "Monitoraggio della reputazione online di un’azienda/sentiment_reputation_mlops/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Tutti gli step "run" partono da qui, non dalla radice del repository:
        # e' questa la cartella dove vivono requirements.txt e tests/.
        working-directory: "Monitoraggio della reputazione online di un’azienda/sentiment_reputation_mlops"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: "Monitoraggio della reputazione online di un’azienda/sentiment_reputation_mlops/requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q
