name: Train - Monitoraggio reputazione online

# Trigger manuale (Actions -> Train -> Run workflow), non automatico ad ogni
# push: un fine-tuning, anche piccolo, su runner CPU gratuiti puo' richiedere
# diversi minuti, e non ha senso farlo scattare per ogni commit che magari
# tocca solo un test o un README.
on:
  workflow_dispatch:
    # Parametri configurabili al momento del lancio, dalla tab Actions di
    # GitHub - passati poi come argomenti da riga di comando a train.py.
    inputs:
      n_train:
        description: "Esempi di retraining (totale, divisi per classe)"
        default: "90"
      epochs:
        description: "Epoche di fine-tuning"
        default: "1"

jobs:
  # ============================================================
  # JOB: TRAIN (Fase 2 - training automatizzato del modello)
  # ============================================================
  train:
    runs-on: ubuntu-latest
    defaults:
      run:
        # requirements.txt, train.py e config.py vivono tutti qui.
        working-directory: "Monitoraggio della reputazione online di un’azienda/sentiment_reputation_mlops"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: "Monitoraggio della reputazione online di un’azienda/sentiment_reputation_mlops/requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # train.py: riallena il modello su un dataset diverso, confronta le
      # metriche prima/dopo su due test set, e pubblica il modello candidato
      # su HuggingFace SOLO se non peggiora sul benchmark originale oltre una
      # soglia di tolleranza - altrimenti il job fallisce esplicitamente.
      # HF_TOKEN serve per il push_to_hub finale (secret di repository,
      # permessi di scrittura anche su repo modello, non solo Space).
      - name: Esegui retraining dimostrativo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >
          python train.py
          --n-train ${{ github.event.inputs.n_train }}
          --epochs ${{ github.event.inputs.epochs }}
